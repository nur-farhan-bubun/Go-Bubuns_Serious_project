openapi: "3.0.3"
info:
  title: Location Service API
  description: Manages user location data, nearby queries, and online presence.
  version: "1.0.0"
paths:
  /v1/location:
    put:
      operationId: updateLocation
      summary: Update the current user's location
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLocationRequest"
      responses:
        "200":
          description: Location updated
  /v1/location/nearby:
    get:
      operationId: getNearby
      summary: Get users nearby a location
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
            format: double
        - name: lng
          in: query
          required: true
          schema:
            type: number
            format: double
        - name: radius
          in: query
          schema:
            type: number
            format: double
            default: 1000
      responses:
        "200":
          description: List of nearby users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NearbyUser"
  /v1/presence/online:
    post:
      operationId: setOnline
      summary: Mark the current user as online
      responses:
        "200":
          description: Presence updated
  /v1/presence/offline:
    post:
      operationId: setOffline
      summary: Mark the current user as offline
      responses:
        "200":
          description: Presence updated
components:
  schemas:
    UpdateLocationRequest:
      type: object
      properties:
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
      required:
        - latitude
        - longitude
    NearbyUser:
      type: object
      properties:
        user_id:
          type: string
        distance:
          type: number
          format: double
          description: Distance in meters
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
