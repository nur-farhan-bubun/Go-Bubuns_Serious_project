apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-deployment
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: nurfarhanbubun49/api-gateway:latest
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        - name: USER_SERVICE_URL
          value: "http://user-service:8081"
        - name: MATCH_SERVICE_URL
          value: "http://match-service:8082"
        - name: CHAT_SERVICE_URL
          value: "http://chat-service:8083"
        - name: LOCATION_SERVICE_URL
          value: "http://location-service:8084"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  selector:
    app: api-gateway
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP 
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service-deployment
  labels:
    app: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
      - name: user-service
        image: nurfarhanbubun49/user-service:latest
        ports:
        - containerPort: 8081
        - containerPort: 50051
        env:
        - name: PORT
          value: "8081"
        - name: GRPC_PORT
          value: "50051"
        - name: DATABASE_URL
          value: "postgres://postgres:postgres@172.31.28.113:5432/users?sslmode=disable"
        - name: KAFKA_BROKERS
          value: "kafka:9092"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: JWT_SECRET
              optional: true
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
spec:
  selector:
    app: user-service
  ports:
    - protocol: TCP
      name: http
      port: 8081
      targetPort: 8081
    - protocol: TCP
      name: grpc
      port: 50051
      targetPort: 50051
  type: ClusterIP
---
