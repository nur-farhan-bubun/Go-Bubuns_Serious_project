apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: serious-project-ingress
  annotations:
    kubernetes.io/ingress.class: "traefik"
  
    traefik.ingress.kubernetes.io/router.middlewares: default-strip-api-prefix@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
        
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
        
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
       
          - path: /_next
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 3000
         
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 3000